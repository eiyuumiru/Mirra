name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust tests
    # Process, plist and ownership fixtures use Darwin APIs and macOS tools.
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --no-self-update
      - name: Rust workspace tests
        run: cargo +1.98.1 test --workspace --locked --manifest-path rust/Cargo.toml

  python:
    name: Python and native checks
    # Runtime/process tests use Darwin APIs. This does not claim a supported
    # Mirroring host, a private-framework build, or a physical phone connection.
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Python unit tests
        run: python3 -B -m unittest discover -s tests -v
      - name: Keystore symbol loading (host fixtures)
        run: make symbols
      - name: Bridge endpoint protocol (host fixtures)
        run: make endpoint-protocol
      - name: AWDL repair guards (host fixtures)
        run: make awdl-service
      - name: Host graphics observations (public framework fixtures)
        run: make environment build/inspector
      - name: Validate distributable source
        run: |
          python3 -B - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          from distribution import source_payload
          _, manifest = source_payload('.')
          print('Validated', len(manifest['files']), 'source files')
          PY

      # Native and device checks run separately on supported configurations.
